run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
  disable:
    - errcheck  # Too pedantic for cleanup code
    - gosec     # Security warnings not applicable to this codebase
    - revive    # Style opinions conflict with project style

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
